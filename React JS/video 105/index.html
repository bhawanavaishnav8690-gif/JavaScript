<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #000;
            color: white;
        }
        .box{
            height: 100px;
            width: 100px;
            color: rgb(255, 0, 0);
            border: 2px solid rgb(0, 26, 255);
        }
    </style>
</head>
<body>
    <script>
        let box1 = "I am box 1";
        let box2 = "I am box 1";
        let box3 = "I am box 1";
    </script>
    <div class="box box1">Box 1</div>
    <div class="box box2">box 2</div>
    <div class="box box3">box 3</div>
    <script>
        setTimeout(() => {
            document.querySelector('.box1').innerHTML = 'hey';
        }, 1000);
        setTimeout(() => {
            document.querySelector('.box2').innerHTML = 'hi';
        }, 1000);
        setTimeout(() => {
            document.querySelector('.box3').innerHTML = 'hello';
        }, 1000);
    </script>
</body>
</html>
