<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number guessing game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div id="wrapper">
        <h1>Number guessing game</h1>
        <p>Try and guess a random number between 1 to 100.</p>
        <p>You have 10 attempts to guess the rigth number.</p>
        <br>
        <form class="form">
            <label for="guessField" id="guess">Guess a number : </label>
            <input type="text" class="guessFild" id="guessFild">
            <input type="submit" value="Submit guess " id="subt" class="guessSubmit">
        </form>
        <div class="resultpara">
            <p>Previous Guesses: <span class="guesses"></span></p>
            <p>Guesses Remaining: <span class="lastresult">10</span></p>
            <p class="lowOrhi"></p>
        </div>
    </div>
</body>
</html>
